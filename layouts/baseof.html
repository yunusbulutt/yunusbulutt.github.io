<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" data-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "theme-toggle.html" . }}
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  {{ with resources.Get "js/theme.js" | minify | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous"></script>
  {{ end }}
</body>
</html>
